name: SauceDemo QA Pipeline

# 1. When should this run?
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Gives you a manual "Run" button on GitHub

jobs:
  build-and-test:
    # 2. Rent a temporary Linux machine
    runs-on: ubuntu-latest

    steps:
      # Action A: Download your code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Action B: Install Java
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # Action C: Run the Selenium tests!
      - name: Execute Automation Suite
        run: mvn clean test

      # Action D: Save the ExtentReports Dashboard
      - name: Upload QA Dashboard
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ExtentReport-Dashboard
          path: reports/AutomationReport.html

      # Action E: Save Error Screenshots (only if something breaks)
      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: Error-Screenshots
          path: screenshots/