name: SauceDemo QA Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4 # Updated to v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Execute Automation Suite
        run: mvn clean test

      - name: Upload QA Dashboard
        if: always()
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: ExtentReport-Dashboard
          path: reports/AutomationReport.html

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: Error-Screenshots
          path: screenshots/